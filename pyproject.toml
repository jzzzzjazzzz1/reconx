[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconx"
version = "1.0.0"
description = "Subdomain and Exposure Recon Tool"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "dnspython>=2.4.2",
    "colorama>=0.4.6",
    "jinja2>=3.1.2",
]

[project.scripts]
reconx = "reconx.main:main"

[tool.setuptools]
packages = ["reconx"]
